apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: fiap-cloud-users
  labels:
    app: users
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: users
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

